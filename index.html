<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЛ компани — Сервисный центр</title>
    <style>
        :root {
            --font-sans: 'Segoe UI', Roboto, system-ui, sans-serif;
            --color-bg-main: #f5f7fa;
            --color-bg-card: #ffffff;
            --color-primary: #1a6fc4;
            --color-primary-dark: #0d4a8a;
            --text-main: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #eeeeee;
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--color-bg-main); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 420px;
            background: var(--color-bg-card);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 0 0 32px 32px;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            color: #fff;
        }

        .header-icon {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.2rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .content { padding: 1.5rem 1.2rem; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1.5rem 0 12px 5px;
        }

        /* Универсальный стиль кнопок */
        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--color-bg-card);
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.98); }

        .btn-icon {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .btn-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .btn-sub { font-size: 13px; color: var(--text-secondary); }

        /* Карточка адреса */
        .address-card {
            padding: 16px;
            background: #fcfcfc;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .address-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .address-info p { font-size: 13px; color: var(--text-secondary); }

        .map-wrapper {
            width: 100%;
            height: 300px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .footer {
            margin-top: auto;
            padding: 2.5rem 1rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div class="header-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6-3.8 3.8a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8 1.6 1.6a1 1 0 0 0 1.4 0l1.6-1.6a1 1 0 0 0 0-1.4L14.7 6.3z"/>
            </svg>
        </div>
        <h1>СЛ компани</h1>
        <p>Ремонт цифровой техники в Тюмени</p>
    </div>

    <div class="content">
        <div class="section-label">Связаться с нами</div>
        
        <a href="https://t.me/YOUR_BOT_USERNAME" class="btn" target="_blank">
            <div class="btn-icon" style="background: #e1f5fe;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#039be5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
            </div>
            <div class="btn-text">
                <div class="btn-title">Telegram</div>
                <div class="btn-sub">Записаться на ремонт</div>
            </div>
        </a>

        <a href="https://tamtam.chat/YOUR_USERNAME" class="btn" target="_blank">
            <div class="btn-icon" style="background: #fff3e0;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#f57c00"><path d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm3.293 6.293a1 1 0 0 0-1.414 0L12 10.172 10.121 8.293a1 1 0 0 0-1.414 1.414L10.586 11.586l-1.879 1.879a1 1 0 0 0 1.414 1.414L12 12.999l1.879 1.88a1 1 0 0 0 1.414-1.414l-1.88-1.879 1.88-1.88a1 1 0 0 0 0-1.413z"/></svg>
            </div>
            <div class="btn-text">
                <div class="btn-title">Мессенджер</div>
                <div class="btn-sub">Написать в ТамТам (Макс)</div>
            </div>
        </a>

        <a href="mailto:info@sl-company.ru" class="btn" target="_blank">
            <div class="btn-icon" style="background: #f5f5f5;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#616161"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div class="btn-text">
                <div class="btn-title">Почта</div>
                <div class="btn-sub">Написать нам письмо</div>
            </div>
        </a>

        <div class="section-label">Наш адрес</div>

        <div class="address-card">
            <div style="color: #f44336; margin-top: 2px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
            </div>
            <div class="address-info">
                <h3>Тюмень, ул. Жуковского, 26</h3>
                <p>Пн-Пт: 09:00 – 18:00</p>
            </div>
        </div>

        <div class="map-wrapper">
            <iframe 
                src="https://yandex.ru/map-widget/v1/?ll=65.641377%2C57.173954&z=16&pt=65.641377%2C57.173954%2Cpm2rdl" 
                width="100%" height="100%" frameborder="0" allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 СЛ компани</p>
    </div>
</div>

</body>
</html>
