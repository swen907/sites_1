<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЛ компани — Сервисный центр</title>
    <style>
        /* Базовые настройки и переменные для корректного отображения */
        :root {
            --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --color-bg-main: #f0f4f8;
            --color-bg-card: #ffffff;
            --color-primary: #1a6fc4;
            --color-primary-dark: #0d4a8a;
            --text-main: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #eeeeee;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--color-bg-main); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 420px;
            background: var(--color-bg-card);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Шапка в стиле СЛ компани */
        .header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 0 0 30px 30px;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            color: #fff;
        }

        .header-icon {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.5px; }
        .header p { font-size: 14px; opacity: 0.85; font-weight: 400; }

        .content { padding: 1.5rem 1.2rem; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1.5rem 0 10px 5px;
        }

        /* Стили кнопок-ссылок */
        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--color-bg-card);
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn:hover { background: #f9f9f9; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }

        .btn-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .btn-text { flex: 1; }
        .btn-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .btn-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .btn-arrow { color: var(--text-muted); font-size: 20px; font-weight: 300; }

        /* Карта */
        .map-wrapper {
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            height: 200px;
            margin-top: 10px;
        }

        .footer {
            margin-top: auto;
            padding: 2.5rem 1rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div class="header-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6-3.8 3.8a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8 1.6 1.6a1 1 0 0 0 1.4 0l1.6-1.6a1 1 0 0 0 0-1.4L14.7 6.3z"/>
                <path d="M7 10l5 5" opacity="0.5"/>
            </svg>
        </div>
        <h1>СЛ компани</h1>
        <p>Ремонт цифровой техники в Тюмени</p>
    </div>

    <div class="content">
        <div class="section-label">Связаться с нами</div>

            </div>
            <div class="btn-text">

            </div>
            <div class="btn-text">
                <div class="btn-title">WhatsApp</div>
                <div class="btn-sub">Написать мастеру</div>
            </div>
            <div class="btn-arrow">›</div>
        </a>

        <div class="section-label">Наш адрес</div>
        <div class="map-wrapper">
            <iframe
                src="https://widgets.2gis.com/widget?type=firmsonmap&options=%7B%22pos%22%3A%7B%22lat%22%3A57.173954%2C%22lon%22%3A65.641377%2C%22zoom%22%3A16%7D%2C%22opt%22%3A%7B%22city%22%3A%22tyumen%22%7D%2C%22org%22%3A%2270000001021153021%22%7D"
                width="100%" height="100%" frameborder="0">
            </iframe>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 СЛ компани. Тюмень, Солнечный проезд.</p>
    </div>
</div>

</body>
</html>
