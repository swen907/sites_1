<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЛ компани — Сервисный центр</title>
    <style>
        :root {
            --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --color-bg-main: #f5f7fa;
            --color-bg-card: #ffffff;
            --color-primary: #1a6fc4;
            --color-primary-dark: #0d4a8a;
            --text-main: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #eeeeee;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--color-bg-main); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 420px;
            background: var(--color-bg-card);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 0 0 30px 30px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: #fff;
        }

        .header-icon {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.85; }

        .content { padding: 1rem 1.2rem; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1rem 0 8px 5px;
        }

        /* Кнопки связи */
        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--color-bg-card);
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .btn-title { font-size: 15px; font-weight: 600; color: var(--text-main); }

        /* КОНТЕЙНЕР ДЛЯ УМЕНЬШЕНИЯ МОДУЛЯ В 2 РАЗА */
        .zoom-wrapper {
            width: 100%;
            height: 180px; /* Фиксируем высоту, чтобы контент не наезжал */
            overflow: hidden;
            position: relative;
            margin-top: -10px;
        }

        .scaled-module {
            transform: scale(0.5); /* Уменьшаем в 2 раза */
            transform-origin: top left; /* Точка сжатия — верхний левый угол */
            width: 200%; /* Компенсируем ширину, чтобы контент внутри не сжался в узкую полоску */
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Дополнительные правки стилей внутри уменьшенного модуля */
        .callout._module_firmCallout {
            border: 2px solid var(--border) !important;
            border-radius: 30px !important;
            background: #fff !important;
        }

        /* Карта под уменьшенным модулем */
        .map-container {
            width: 100%;
            height: 200px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .footer {
            margin-top: auto;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div class="header-icon">

        </div>
        <h1>СЛ компани</h1>
        <p>Ремонт цифровой техники в Тюмени</p>
    </div>

    <div class="content">
        <div class="section-label">Связаться с нами</div>
        
        <a href="https://t.me/YOUR_BOT_USERNAME" class="btn">

            <div class="btn-title">Написать в Telegram</div>
        </a>

        <div class="section-label">Информация о сервисе</div>

        <div class="zoom-wrapper">

                    </div>

                        <a href="https://2gis.ru/tyumen/firm/70000001021153021" class="callout__btn" style="background: var(--color-primary); color: #fff; padding: 15px; border-radius: 12px; flex: 1; text-align: center; text-decoration: none; font-size: 20px;">Подробнее</a>
                        <a href="https://2gis.ru/tyumen/center/65.641377,57.174077/zoom/16/routeTab/rsType/bus/to/65.641353,57.174077" class="callout__btn" style="background: var(--color-primary); color: #fff; padding: 15px; border-radius: 12px; flex: 1; text-align: center; text-decoration: none; font-size: 20px;">Маршрут</a>
                    </footer>
                </div>
            </div>
        </div>

        <div class="map-container">
            <iframe src="https://widgets.2gis.com/widget?type=firmsonmap&options=%7B%22pos%22%3A%7B%22lat%22%3A57.173954%2C%22lon%22%3A65.641377%2C%22zoom%22%3A16%7D%2C%22opt%22%3A%7B%22city%22%3A%22tyumen%22%7D%2C%22org%22%3A%2270000001021153021%22%7D" width="100%" height="100%" frameborder="0"></iframe>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 СЛ компани. Тюмень.</p>
    </div>
</div>

</body>
</html>
