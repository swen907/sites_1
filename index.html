
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }

  .page {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 0 2rem;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .header {
    background: linear-gradient(135deg, #1a6fc4 0%, #0d4a8a 100%);
    border-radius: 0 0 24px 24px;
    padding: 2.2rem 1.5rem 2rem;
    text-align: center;
    color: #fff;
    margin-bottom: 1.5rem;
  }

  .header-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.18);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
  }

  .header-icon svg { width: 30px; height: 30px; }

  .header h1 {
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    font-weight: 400;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 0 1rem;
    margin-bottom: 8px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 1rem;
    margin-bottom: 1.5rem;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }

  .btn:hover { background: var(--color-background-secondary); }
  .btn:active { transform: scale(0.985); }

  .btn-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .btn-icon svg { width: 22px; height: 22px; }

  .btn-text { flex: 1; }
  .btn-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
  }
  .btn-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 1px;
  }

  .btn-arrow {
    color: var(--color-text-tertiary);
    font-size: 16px;
  }

  .whatsapp .btn-icon { background: #e8f8ef; }
  .telegram .btn-icon { background: #e8f3fc; }
  .email .btn-icon { background: #fff0e8; }

  .address-wrap {
    padding: 0 1rem;
    margin-bottom: 1.5rem;
  }

  .address-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    text-decoration: none;
    transition: background 0.15s;
  }

  .address-card:hover { background: var(--color-background-secondary); }

  .addr-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: #fde8e8;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .addr-icon svg { width: 22px; height: 22px; }

  .addr-text { flex: 1; }
  .addr-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
  }
  .addr-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 1px;
  }

  .map-wrap {
    padding: 0 1rem;
  }

  .map-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .map-container {
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    border: 0.5px solid var(--color-border-tertiary);
    height: 200px;
    position: relative;
    background: #e8edf0;
    cursor: pointer;
  }

  .map-container iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }

  .map-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 10px;
    pointer-events: none;
  }

  .map-badge {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--color-text-secondary);
    display: flex; align-items: center; gap: 5px;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--color-text-tertiary);
    margin-top: 1.2rem;
    padding: 0 1rem;
  }
</style>
