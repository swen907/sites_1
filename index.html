<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЛ компани — Сервисный центр</title>
    <style>
        :root {
            --font-sans: 'Segoe UI', Roboto, system-ui, sans-serif;
            --color-bg-main: #f5f7fa;
            --color-bg-card: #ffffff;
            --color-primary: #1a6fc4;
            --color-primary-dark: #0d4a8a;
            --text-main: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #eeeeee;
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--color-bg-main); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 420px;
            background: var(--color-bg-card);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 0 0 32px 32px;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            color: #fff;
        }

        .header-icon {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.2rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .content { padding: 1.5rem 1.2rem; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1.5rem 0 12px 5px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--color-bg-card);
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.98); }

        .btn-icon {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            overflow: hidden; /* Чтобы логотип не вылезал */
        }

        .btn-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .btn-sub { font-size: 13px; color: var(--text-secondary); }

        .address-card {
            padding: 16px;
            background: #fcfcfc;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .address-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .address-info p { font-size: 13px; color: var(--text-secondary); }

        .map-wrapper {
            width: 100%;
            height: 300px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .footer {
            margin-top: auto;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
