<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЛ компани — Сервисный центр</title>
    <style>
        :root {
            --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --color-bg-main: #f5f7fa;
            --color-bg-card: #ffffff;
            --color-primary: #1a6fc4;
            --color-primary-dark: #0d4a8a;
            --text-main: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #eeeeee;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--color-bg-main); 
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 420px;
            background: var(--color-bg-card);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: 0 0 30px 30px;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            color: #fff;
        }

        .header-icon {
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.5px; }
        .header p { font-size: 14px; opacity: 0.85; }

        .content { padding: 1.5rem 1.2rem; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1.5rem 0 10px 5px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--color-bg-card);
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .btn:hover { background: #f9f9f9; transform: translateY(-1px); }

        .btn-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .btn-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .btn-sub { font-size: 13px; color: var(--text-secondary); }

        /* СПЕЦИАЛЬНЫЕ СТИЛИ ДЛЯ МОДУЛЯ 2ГИС */
        .callout._module_firmCallout {
            padding: 15px !important;
            font-size: 13px !important;
            background: #fafafa !important;
            border-radius: var(--radius) !important;
            border: 1px solid var(--border) !important;
            box-shadow: none !important;
        }

        .callout__address { font-weight: 600 !important; font-size: 14px !important; margin-bottom: 4px !important; }
        .callout__phone { font-weight: 700 !important; color: var(--color-primary) !important; margin-bottom: 8px !important; }
        .callout__payment, .callout__photo, .callout__addressComment { display: none !important; }
        
        .callout__footer {
            margin-top: 12px !important;
            padding-top: 12px !important;
            border-top: 1px solid var(--border) !important;
            display: flex !important;
            gap: 8px !important;
        }

        .callout__btn, .fromTo__btn {
            background: var(--color-primary) !important;
            color: #fff !important;
            padding: 8px !important;
            border-radius: 10px !important;
            font-size: 11px !important;
            text-align: center !important;
            text-decoration: none !important;
            flex: 1 !important;
        }

        .footer {
            margin-top: auto;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div class="header-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6-3.8 3.8a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8 1.6 1.6a1 1 0 0 0 1.4 0l1.6-1.6a1 1 0 0 0 0-1.4L14.7 6.3z"/>
            </svg>
        </div>
        <h1>СЛ компани</h1>
        <p>Ремонт цифровой техники в Тюмени</p>
    </div>

    <div class="content">
        <div class="section-label">Связаться с нами</div>
        
        <a href="https://t.me/YOUR_BOT_USERNAME" class="btn">

            </div>
            <div>
                <div class="btn-title">Telegram</div>
                <div class="btn-sub">Записаться на ремонт</div>
            </div>
        </a>

        <div class="section-label">Наш адрес и контакты</div>

        <div id="module-1-1-1" class="callout _module_firmCallout">
            <address class="callout__address">улица Жуковского, 26</address>
            <div class="callout__phone">+7 (3452) 57‒54‒57</div>
            <div class="callout__workhours">
                <a href="#" class="callout__scheduleToday">Сегодня 09:00–18:00</a>
            </div>
            <footer class="callout__footer">
                <a href="http://2gis.ru/tyumen/firm/70000001021153021" target="_blank" class="callout__btn">Инфо</a>
                <div id="module-1-1-1-1" class="fromTo _context_callout" style="display: flex; gap: 5px; flex: 1;">
                    <a target="_blank" href="http://2gis.ru/tyumen/center/65.641377,57.174077/zoom/16/routeTab/rsType/bus/to/65.641353,57.174077" class="fromTo__btn">Сюда</a>
                </div>
            </footer>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 СЛ компани. Все права защищены.</p>
    </div>
</div>

</body>
</html>
